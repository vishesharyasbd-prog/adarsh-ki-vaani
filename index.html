<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(ellipse at 50% 12%,#463317 0%,transparent 45%),
#070707;
font-family:Arial,sans-serif;
color:white;
}

.card{
width:100%;
max-width:390px;
padding:38px 25px 32px;
text-align:center;
border-radius:27px;
position:relative;
overflow:hidden;
background:linear-gradient(145deg,
rgba(255,255,255,.10),
rgba(255,255,255,.025));
border:1px solid rgba(226,184,93,.45);
box-shadow:0 0 30px rgba(221,169,66,.16),
inset 0 0 25px rgba(255,255,255,.025);
backdrop-filter:blur(20px);
}

.card:before{
content:"";
position:absolute;
top:0;
left:15%;
width:70%;
height:1px;
background:linear-gradient(90deg,
transparent,#ffe3a0,transparent);
box-shadow:0 0 15px #e6bd70;
}

.profile{
width:158px;
height:158px;
padding:5px;
margin:0 auto 25px;
border-radius:50%;
border:2px solid #e5bd70;
box-shadow:0 0 15px #c79743,
0 0 35px rgba(220,168,76,.5);
animation:glow 2.5s infinite alternate;
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
border-radius:50%;
display:block;
}

@keyframes glow{
from{box-shadow:0 0 12px #bd9149}
to{box-shadow:0 0 30px #ffcf78,
0 0 48px rgba(255,191,75,.4)}
}

h1{
font-size:27px;
font-weight:800;
letter-spacing:1px;
line-height:1.3;
background:linear-gradient(90deg,
#fff1c9,#d5a64e,#fff0bd);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:12px;
}

.tagline{
font-size:13px;
color:#c5bba7;
letter-spacing:1.5px;
margin-bottom:28px;
}

.line{
width:65px;
height:2px;
margin:0 auto 25px;
background:linear-gradient(90deg,
transparent,#e4bd75,transparent);
}

.description{
color:#ded8cc;
font-size:14px;
line-height:1.8;
margin-bottom:30px;
}

.join-btn{
width:100%;
min-height:58px;
border:1px solid #ffe3a0;
border-radius:14px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
background:linear-gradient(110deg,
#a97829,#f0ce81,#b17d2e);
color:#160f05;
font-size:15px;
font-weight:900;
letter-spacing:1px;
text-decoration:none;
box-shadow:0 0 15px rgba(230,181,85,.45),
0 0 35px rgba(230,181,85,.18);
transition:.3s;
cursor:pointer;
}

.join-btn:active{transform:scale(.97)}

.join-btn:hover{
box-shadow:0 0 30px rgba(255,204,112,.7);
}

.telegram-icon{font-size:21px}

.footer{
margin-top:25px;
font-size:11px;
color:#898174;
letter-spacing:1px;
}

.verified{
margin-top:18px;
color:#d8bd83;
font-size:11px;
letter-spacing:1px;
}
</style>
</head>
