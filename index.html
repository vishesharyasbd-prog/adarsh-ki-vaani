<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(ellipse at top,#352512 0%,transparent 45%),
#080808;
font-family:Arial,sans-serif;
color:#fff;
}

.card{
width:100%;
max-width:390px;
padding:48px 25px 35px;
text-align:center;
border-radius:25px;
background:linear-gradient(145deg,
rgba(255,255,255,.09),
rgba(255,255,255,.02));
border:1px solid rgba(226,184,93,.5);
box-shadow:
0 0 25px rgba(221,169,66,.18),
inset 0 0 25px rgba(255,255,255,.025);
backdrop-filter:blur(20px);
position:relative;
overflow:hidden;
}

.card:before{
content:"";
position:absolute;
top:0;
left:15%;
width:70%;
height:1px;
background:linear-gradient(
90deg,transparent,#ffe3a0,transparent);
box-shadow:0 0 15px #e6bd70;
}

h1{
font-size:29px;
font-weight:900;
letter-spacing:1px;
line-height:1.4;
background:linear-gradient(
90deg,#fff1c9,#d5a64e,#fff0bd);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:12px;
}

.tagline{
font-size:12px;
color:#c5bba7;
letter-spacing:2px;
margin-bottom:30px;
}

.line{
width:70px;
height:2px;
margin:0 auto 27px;
background:linear-gradient(
90deg,transparent,#e4bd75,transparent);
}

.description{
font-size:14px;
line-height:1.9;
color:#ded8cc;
margin-bottom:32px;
}

.join-btn{
width:100%;
min-height:59px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
border:1px solid #ffe3a0;
border-radius:14px;
background:linear-gradient(
110deg,#a97829,#f0ce81,#b17d2e);
color:#160f05;
font-size:15px;
font-weight:900;
letter-spacing:1px;
text-decoration:none;
box-shadow:
0 0 15px rgba(230,181,85,.45),
0 0 35px rgba(230,181,85,.18);
transition:.3s;
}

.join-btn:hover{
box-shadow:0 0 30px rgba(255,204,112,.7);
}

.join-btn:active{
transform:scale(.97);
}

.verified{
margin-top:25px;
font-size:11px;
color:#d8bd83;
letter-spacing:1.5px;
}

.footer{
margin-top:25px;
font-size:10px;
color:#898174;
letter-spacing:1px;
}

<div class="card">

class="join-btn" id="joinButton">
➤ JOIN CHANNEL NOW
</a>

<div class="verified">
✦ OFFICIAL COMMUNITY ✦
</div>

<div class="footer">
© 2026 ADARSH KI VAANI
</div>

</div>

<script>
document.getElementById('joinButton')
.addEventListener('click',function(e){

e.preventDefault();

const telegramLink=this.href;

if(typeof fbq==='function'){
fbq('track','Subscribe');
}

setTimeout(function(){
window.location.href=telegramLink;
},500);

});
</script>
