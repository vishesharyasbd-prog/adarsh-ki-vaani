<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Arial,sans-serif;
 color:#07131c;
 background:
 radial-gradient(circle at 15% 10%,#fff,transparent 35%),
 linear-gradient(135deg,#55c5f5,#b7edff,#69cdf5);
}

.card{
 width:100%;
 max-width:390px;
 padding:32px 24px 27px;
 text-align:center;
 border:2px solid #07131c;
 border-radius:28px;
 background:rgba(255,255,255,.38);
 backdrop-filter:blur(18px);
 -webkit-backdrop-filter:blur(18px);
 box-shadow:0 18px 45px rgba(0,50,80,.18),
 inset 0 1px 0 rgba(255,255,255,.8);
}

.logo-wrap{
 width:120px;
 height:120px;
 margin:0 auto 20px;
 padding:4px;
 border:2px solid #07131c;
 border-radius:50%;
 overflow:hidden;
 background:white;
 box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.logo{
 width:100%;
 height:100%;
 display:block;
 object-fit:cover;
 border-radius:50%;
}

h1{
 font-size:28px;
 font-weight:800;
 letter-spacing:-.6px;
 margin-bottom:12px;
}

.subtitle{
 font-size:14px;
 line-height:1.5;
 color:#243c4a;
 margin-bottom:27px;
}

.join-btn{
 display:flex;
 align-items:center;
 justify-content:center;
 width:100%;
 min-height:56px;
 padding:15px;
 border:2px solid #07131c;
 border-radius:15px;
 background:linear-gradient(135deg,#fff,#d8f5ff);
 color:#07131c;
 text-decoration:none;
 font-size:16px;
 font-weight:800;
 box-shadow:0 6px 0 #07131c;
 transition:.2s;
}

.join-btn:active{
 transform:translateY(5px);
 box-shadow:0 1px 0 #07131c;
}

.footer{
 margin-top:24px;
 font-size:11px;
 font-weight:bold;
 letter-spacing:1.3px;
 color:#314d5b;
}
</style>
